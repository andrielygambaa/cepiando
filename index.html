<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CEPiando</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <h1>CEPiando</h1>
    <p class="intro">A gente xereta o endereço por você: é só digitar o CEP.</p>

    <form id="form-cadastro" novalidate>
      <label for="nome">Nome completo</label>
      <input id="nome" type="text" autocomplete="name">

      <label for="cep">CEP</label>
      <div class="linha-cep">
        <input id="cep" type="text" inputmode="numeric" maxlength="9"
               placeholder="00000-000" autocomplete="postal-code">
        <button id="btn-buscar" type="button">Buscar CEP</button>
      </div>

      <!-- Mensagens de sucesso, carregando e erro aparecem aqui -->
      <p id="mensagem" role="status" aria-live="polite"></p>

      <label for="rua">Rua</label>
      <input id="rua" type="text">

      <div class="duas-colunas">
        <div>
          <label for="numero">Número</label>
          <input id="numero" type="text" inputmode="numeric">
        </div>
        <div>
          <label for="bairro">Bairro</label>
          <input id="bairro" type="text">
        </div>
      </div>

      <div class="duas-colunas cidade-uf">
        <div>
          <label for="cidade">Cidade</label>
          <input id="cidade" type="text">
        </div>
        <div>
          <label for="uf">UF</label>
          <input id="uf" type="text" maxlength="2">
        </div>
      </div>
    </form>
  </main>

  <script src="js/cep.js"></script>
</body>
</html>
